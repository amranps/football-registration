<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Tournament Registration</title>

    <link rel="stylesheet" href="football.css">
</head>

<body>

    <div class="container">

        <h1>Football Tournament</h1>
        <p>Player Registration Form</p>

        <form action="#" method="post">

            <label>Full Name:</label>
            <input type="text" name="name"
                   placeholder="Enter your full name" required>

            <label>Date of Birth:</label>
            <input type="date" name="dob" required>

            <label>Gender:</label>
            <div class="gender">
                <input type="radio" name="gender" value="Male" required> Male
                <input type="radio" name="gender" value="Female"> Female
                <input type="radio" name="gender" value="Other"> Other
            </div>

            <label>Email Address:</label>
            <input type="email" name="email"
                   placeholder="Enter your email" required>

            <label>Phone Number:</label>
            <input type="tel" name="phone"
                   placeholder="Enter phone number" required>

            <label>Address:</label>
            <textarea name="address"
                      placeholder="Enter your address"
                      rows="3" required></textarea>

            <label>Playing Position:</label>
            <select name="position" required>
                <option value="">Select Position</option>
                <option>Goalkeeper</option>
                <option>Defender</option>
                <option>Midfielder</option>
                <option>Forward</option>
            </select>

            <label>Tournament Category:</label>
            <select name="tournament" required>
                <option value="">Select Category</option>
                <option>Under 16</option>
                <option>Under 19</option>
                <option>Open Category</option>
                <option>Veterans</option>
            </select>

            <label>Registration Date:</label>
            <input type="date" name="registration_date" required>

            <div class="buttons">
                <button type="submit" class="submit">
                    Submit
                </button>

                <button type="reset" class="reset">
                    Reset
                </button>
            </div>

        </form>

    </div>

</body>
</html>
